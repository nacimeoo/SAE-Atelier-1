<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Rock Vibration - Programme</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <div class="logo">NRV</div>
            <nav class="nav-links">
                <a href="#" class="active">Programme</a>
                <a href="#">Lieux</a>
                <a href="#">Infos pratiques</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="#">Connexion</a>
            <a href="#"><strong>Panier <span id="compteur-panier">0</span></strong></a>
        </div>
    </header>

    <main class="container">
        <header class="page-header">
            <div id="page-header-title" class="title-section">
                <h1>Programme</h1>
                <p class="subtitle">Nancy Rock Vibration · 5 – 18 novembre 2026</p>
            </div>
        </header>

        <section id="spectacles-section">
            <div class="page-header">
                <div class="filters">
                    <div class="filter-group">
                        <label for="date-filter">Date</label>
                        <input type="date" id="date-filter" style="padding: 0.5rem 1rem; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 1rem;">
                    </div>

                    <div class="filter-group">
                        <label for="style-filter">Style</label>
                        <select id="style-filter">
                            <option value="">Tous les styles</option>
                        </select>
                    </div>

                    <div class="filter-group" style="justify-content: flex-end; flex-direction: row;">
                        <button id="apply-filters" style="cursor: pointer; padding: 0.5rem 1rem;">Filtrer</button>
                        <button id="reset-filters" style="cursor: pointer; padding: 0.5rem 1rem;">Réinitialiser</button>
                    </div>
                </div>
            </div>
            <div id="spectacles-grid" class="grid-container">
            </div>
        </section>

        <section id="soiree-section" style="display: none;">
            <button id="btn-retour" style="margin-bottom: 2rem; cursor: pointer; padding: 0.5rem 1rem;">← Retour au programme</button>
            <div id="soiree-detail"></div>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
