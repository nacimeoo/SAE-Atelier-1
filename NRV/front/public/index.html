<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Rock Vibration - Programme</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <div class="logo">NRV</div>
            <nav class="nav-links">
                <a href="#" class="active">Programme</a>
                <a href="#">Lieux</a>
                <a href="#">Infos pratiques</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="#" id="lien-connexion">Connexion</a>
            <span id="zone-user" style="display: none;">
                <span id="nom-utilisateur"></span>
                <a href="#" id="lien-deconnexion">Déconnexion</a>
            </span>
            <a href="#"><strong>Panier <span id="compteur-panier">0</span></strong></a>
        </div>
    </header>

    <main class="container">
        <header class="page-header">
            <div id="page-header-title" class="title-section">
                <h1>Programme</h1>
                <p class="subtitle">Nancy Rock Vibration · 5 – 18 novembre 2026</p>
            </div>
        </header>

        <section id="spectacles-section">
            <div class="page-header">
                <div class="filters">
                    <div class="filter-group">
                        <label for="date-filter">Date</label>
                        <input type="date" id="date-filter" style="padding: 0.5rem 1rem; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 1rem;">
                    </div>

                    <div class="filter-group">
                        <label for="style-filter">Style</label>
                        <select id="style-filter">
                            <option value="">Tous les styles</option>
                        </select>
                    </div>

                    <div class="filter-group" style="justify-content: flex-end; flex-direction: row;">
                        <button id="apply-filters" style="cursor: pointer; padding: 0.5rem 1rem;">Filtrer</button>
                        <button id="reset-filters" style="cursor: pointer; padding: 0.5rem 1rem;">Réinitialiser</button>
                    </div>
                </div>
            </div>
            <div id="spectacles-grid" class="grid-container">
            </div>
        </section>

        <section id="soiree-section" style="display: none;">
            <button id="btn-retour" style="margin-bottom: 2rem; cursor: pointer; padding: 0.5rem 1rem;">← Retour au programme</button>
            <div id="soiree-detail"></div>
        </section>

        <section id="auth-section" style="display: none;">
            <button id="btn-retour-auth" style="margin-bottom: 2rem; cursor: pointer; padding: 0.5rem 1rem;">← Retour au programme</button>

            <div class="auth-card">
                <form id="login-form">
                    <h2>Connexion</h2>
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" required>
                    <button type="submit" class="btn-primary">Se connecter</button>
                    <p id="login-error" class="auth-error"></p>
                    <a href="#" id="vers-inscription">Pas de compte ? S'inscrire</a>
                </form>

                <form id="register-form" style="display: none;">
                    <h2>Inscription</h2>
                    <label for="register-nom">Nom</label>
                    <input type="text" id="register-nom" required>
                    <label for="register-prenom">Prénom</label>
                    <input type="text" id="register-prenom" required>
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                    <label for="register-password">Mot de passe (8 caractères minimum)</label>
                    <input type="password" id="register-password" minlength="8" required>
                    <button type="submit" class="btn-primary">Créer mon compte</button>
                    <p id="register-error" class="auth-error"></p>
                    <a href="#" id="vers-connexion">Déjà un compte ? Se connecter</a>
                </form>
            </div>
        </section>

    </main>

    <script src="/js/app.js"></script>
</body>
</html>
